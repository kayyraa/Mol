<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

        <link rel="stylesheet" href="Scripts/Style.css">
        <link rel="shortcut icon" href="Images/Favicon.svg" type="image/x-icon">

        <script type="module" src="Scripts/Enum.js"></script>
        <script type="module" src="Scripts/Chemistry.js"></script>
        <script type="module" src="Scripts/Plugin.js"></script>
        <script type="module" src="Scripts/Plugins/LatticeMaker.js"></script>
        <script type="module" src="Scripts/Plugins/RadiationMonitor.js"></script>
        <script type="module" src="Scripts/Plugins/Emitter.js"></script>
        <script type="module" src="Scripts/Plugins/NuclearInspector.js"></script>
        <script type="module" src="Scripts/Plugins/MoleculeSketcher.js"></script>
        <script type="module" src="Scripts/Global.d.js"></script>

        <title>Mol</title>
    </head>
    <body>
        <div class="MobileBar" id="MobileBar">
            <button type="button" class="MobileBtn" data-target="DashboardPanel">Stats</button>
            <span class="MobileTitle"><img class="MobileFavicon" src="Images/Favicon.svg" alt="">Mol</span>
            <button type="button" class="MobileBtn" data-target="HierarchyPanel">Atoms</button>
        </div>
        <div class="Area Dashboard" id="DashboardPanel">
            <small><img class="Favicon" src="Images/Favicon.svg">Mol</small><hr>
            <div><span>Framerate</span><span class="Framerate">000/s</span></div>
            <div><span>Delta Time</span><span class="DeltaTime">0.000ms</span></div>
            <div><span>Timescale</span><span class="TimeScale">0.50x</span></div>
            <div><span>Sys Temp</span><span class="Temperature">0.00</span></div>
            <div><span>Bath</span><span class="BathTemp">0.35</span></div>
            <div><span>Bounds</span><span class="BoundsSize">400/400/300</span></div>
            <hr>
            <small>System</small>
            <div class="Prefs DashPrefs">
                <label>Bath temp <input type="range" id="PrefBath" min="0" max="2" step="0.05" value="0.35"><span id="PrefBathVal">0.35</span></label>
                <label>Free energy <input type="range" id="PrefFreeEnergy" min="0" max="3" step="0.1" value="0"><span id="PrefFreeEnergyVal">0.0</span></label>
            </div>
            <hr>
            <small>Display</small>
            <div class="Dropdown" id="DisplayDropdown">
                <button type="button" class="DropdownButton" id="DisplayDropdownButton" aria-haspopup="listbox" aria-expanded="false" aria-controls="DisplayDropdownMenu">
                    <span class="DropdownLabel" id="DisplayDropdownLabel">None</span>
                    <span class="DropdownChevron"></span>
                </button>
                <div class="DropdownMenu" id="DisplayDropdownMenu" role="listbox" hidden>
                    <button type="button" role="option" class="DropdownItem active" data-mode="none"><span class="DropdownCheck"></span><span>None</span></button>
                    <button type="button" role="option" class="DropdownItem" data-mode="charge"><span class="DropdownCheck"></span><span>Charge</span></button>
                    <button type="button" role="option" class="DropdownItem" data-mode="dipole"><span class="DropdownCheck"></span><span>Dipole</span></button>
                    <button type="button" role="option" class="DropdownItem" data-mode="field"><span class="DropdownCheck"></span><span>Field</span></button>
                    <button type="button" role="option" class="DropdownItem" data-mode="force"><span class="DropdownCheck"></span><span>Force</span></button>
                    <button type="button" role="option" class="DropdownItem" data-mode="energy"><span class="DropdownCheck"></span><span>Energy</span></button>
                    <button type="button" role="option" class="DropdownItem" data-mode="radiation"><span class="DropdownCheck"></span><span>Radiation</span></button>
                    <button type="button" role="option" class="DropdownItem" data-mode="quantum"><span class="DropdownCheck"></span><span>Quantum</span></button>
                </div>
            </div>
        </div>
        <div class="Area Hierarchy" id="HierarchyPanel">
            <div class="HierarchyHeader">
                <small>Atoms</small>
                <div class="HierTools">
                    <button class="HierarchyToggle" id="HierarchyCollapseAll" title="Always collapsed">Collapse</button>
                    <button class="HierarchyToggle" id="HierarchyExpandAll" title="Always expanded">Expand</button>
                </div>
            </div>
            <hr>
            <div class="HierarchyTree" id="HierarchyTree"></div>
            <hr>
            <small>Add Atom</small>
            <div class="AtomAdder">
                <select id="AtomSelect" class="AtomSelect"></select>
                <button id="SpawnAtomBtn" class="SpawnBtn">Spawn</button>
            </div>
            <div class="AdderOpts">
                <label>Count <input type="number" id="SpawnCount" min="1" max="20" value="1"></label>
            </div>
            <hr>
            <small>Preferences</small>
            <div class="Prefs">
                <label>Excite amount <input type="range" id="PrefExcite" min="0.2" max="3" step="0.1" value="0.8"><span id="PrefExciteVal">0.8</span></label>
                <label>Impulse strength <input type="range" id="PrefImpulse" min="2" max="20" step="1" value="8"><span id="PrefImpulseVal">8</span></label>
                <label>Shake intensity <input type="range" id="PrefShake" min="0" max="2" step="0.1" value="1"><span id="PrefShakeVal">1.0</span></label>
                <label>Spawn speed <input type="range" id="PrefSpawnSpeed" min="0" max="5" step="0.1" value="0.5"><span id="PrefSpawnSpeedVal">0.5</span></label>
                <label>Bound X <input type="range" id="PrefBoundX" min="100" max="1500" step="25" value="400"><span id="PrefBoundXVal">400</span></label>
                <label>Bound Y <input type="range" id="PrefBoundY" min="100" max="1500" step="25" value="400"><span id="PrefBoundYVal">400</span></label>
                <label>Bound Z <input type="range" id="PrefBoundZ" min="100" max="1500" step="25" value="300"><span id="PrefBoundZVal">300</span></label>
            </div>
        </div>
        <div class="Tooltip"></div>
        <div class="ContextMenu" id="ContextMenu" hidden>
            <div class="CtxTitle">Atom</div>
            <button data-action="excite">Excite (+energy)</button>
            <button data-action="deexcite">De-excite</button>
            <button data-action="impulse">Add Impulse</button>
            <button data-action="heat">Local Heat</button>
            <button data-action="cool">Local Cool</button>
            <hr>
            <button data-action="breakbonds">Break Bonds</button>
            <button data-action="ionize">Ionize (+charge)</button>
            <button data-action="neutralize">Neutralize</button>
            <hr>
            <button data-action="decay">Force Decay</button>
            <button data-action="focus">Focus Camera</button>
            <button data-action="delete" class="Danger">Delete Atom</button>
        </div>
        <div class="TouchControls" id="TouchControls" hidden>
            <div class="Joystick" id="Joystick">
                <div class="JoystickKnob" id="JoystickKnob"></div>
            </div>
            <div class="VerticalButtons">
                <button type="button" class="VerticalButton" id="TouchUp" aria-label="Move up"><span class="VerticalArrow Up"></span><span>Up</span></button>
                <button type="button" class="VerticalButton" id="TouchDown" aria-label="Move down"><span class="VerticalArrow Down"></span><span>Down</span></button>
            </div>
        </div>
        <canvas class="Canvas"></canvas>
    </body>
</html>
